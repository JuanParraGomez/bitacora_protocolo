services:
  bitacora-protocolo:
    build: .
    container_name: bitacora-protocolo-local
    restart: unless-stopped
    environment:
      PORT: 3000
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      - ./data:/app/data
    ports:
      - "${HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
