openapi: 3.1.0
info:
  title: Bitácora Compatibility Storage API
  version: 1.0.0
  description: >
    Contract preserved while the Express storage adapter is replaced by Nuxt/Nitro.
    Values remain opaque strings so existing serialized records are not rewritten.
servers:
  - url: /
paths:
  /api/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Application and storage are available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Application is running but storage is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/storage/{key}:
    parameters:
      - $ref: "#/components/parameters/StorageKey"
    get:
      operationId: getStorageValue
      responses:
        "200":
          description: Stored value found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredValue"
        "404":
          description: Key does not exist.
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: "null"
    put:
      operationId: putStorageValue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoredValue"
      responses:
        "200":
          description: Value accepted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    const: true
        "400":
          description: Body is missing a string value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStorageValue
      responses:
        "204":
          description: Key is absent after the request, whether or not it existed.
components:
  parameters:
    StorageKey:
      name: key
      in: path
      required: true
      description: URL-encoded opaque storage key.
      schema:
        type: string
        minLength: 1
  schemas:
    StoredValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
    Health:
      type: object
      required: [ok, storage]
      properties:
        ok:
          type: boolean
        storage:
          type: string
          enum: [available, unavailable]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
