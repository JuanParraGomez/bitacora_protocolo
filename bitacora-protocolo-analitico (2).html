<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora — protocolo analítico asistido por IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F5; --card:#FFFFFF; --ink:#1C1E21; --ink2:#5C6168; --ink3:#8B9097;
  --line:#E5E2D9; --line2:#D2CEC2;
  --flow:#0E6B62; --flow-ink:#0A4F49; --flow-bg:#E3EFEC; --flow-line:#B9D8D2;
  --gate:#B45309; --gate-ink:#8A3E06; --gate-bg:#FBF0DF; --gate-line:#E8C9A0;
  --danger:#A32D2D; --danger-bg:#F9ECEC;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --disp:'Space Grotesk',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#141619; --card:#1C1F23; --ink:#E9E7E1; --ink2:#A6ABB2; --ink3:#787E86;
    --line:#2B2F34; --line2:#3A3F45;
    --flow:#4FB3A7; --flow-ink:#8AD4CA; --flow-bg:#13302C; --flow-line:#1F4B45;
    --gate:#E0913B; --gate-ink:#F0B87A; --gate-bg:#2E2210; --gate-line:#5C441E;
    --danger:#E07A7A; --danger-bg:#3A1E1E;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
::selection{background:var(--flow-bg)}

/* ---------- shell ---------- */
.shell{display:flex;min-height:100vh}
.side{width:230px;flex-shrink:0;border-right:1px solid var(--line);padding:26px 18px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-family:var(--disp);font-weight:600;font-size:19px;letter-spacing:-.01em;margin-bottom:2px}
.brand small{display:block;font-family:var(--mono);font-weight:400;font-size:10.5px;color:var(--ink3);letter-spacing:.04em;margin-top:3px;line-height:1.5}
.nav{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--ink2);display:flex;gap:9px;align-items:center}
.nav button:hover{background:var(--card);color:var(--ink)}
.nav button.on{background:var(--flow-bg);color:var(--flow-ink);font-weight:500}
.nav button:focus-visible{outline:2px solid var(--flow);outline-offset:1px}
.side .foot{margin-top:auto;font-size:11.5px;color:var(--ink3);font-family:var(--mono);line-height:1.7}
#saveState{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:14px;min-height:16px}
main{flex:1;padding:38px 46px 90px;max-width:940px}
@media(max-width:760px){
  .shell{flex-direction:column}
  .side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;padding:14px 16px;gap:10px}
  .nav{margin-top:0;flex-direction:row;flex-wrap:wrap}
  .side .foot,#saveState{display:none}
  main{padding:22px 16px 70px}
}
@media(max-width:480px){
  h1{font-size:22px}
  .card{padding:15px 14px}
  .ph-head{padding:13px 14px;flex-wrap:wrap}
  .ph-body{padding:2px 14px 16px}
  .toolbar{gap:8px}
  .btn{font-size:13.5px;padding:8px 13px}
  .btn.tiny{font-size:12.5px;padding:6px 10px}
}

/* ---------- type ---------- */
h1{font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:-.015em;line-height:1.25}
h2{font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.01em}
h3{font-family:var(--disp);font-size:15px;font-weight:600}
.sub{color:var(--ink2);margin-top:6px;max-width:60ch}
.eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}

/* ---------- cards & controls ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.btn{all:unset;cursor:pointer;font-family:var(--disp);font-weight:500;font-size:14px;padding:9px 16px;border-radius:8px;background:var(--flow);color:#fff;display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:var(--flow-ink)}
.btn:focus-visible{outline:2px solid var(--flow);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--flow);border:1px solid var(--flow-line)}
.btn.ghost:hover{background:var(--flow-bg)}
.btn.tiny{font-size:12px;padding:5px 10px;border-radius:6px}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.warn:hover{background:var(--danger-bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
label{display:block;font-size:13.5px;font-weight:500;color:var(--ink2);margin:14px 0 5px}
label .opt{font-weight:400;color:var(--ink3)}
input[type=text],textarea,select{width:100%;background:var(--paper);border:1px solid var(--line2);border-radius:8px;padding:9px 11px;font:inherit;font-size:15px;color:var(--ink)}
textarea{resize:vertical;min-height:64px;line-height:1.55}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--flow)}
.checkrow{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:11px 13px;background:var(--paper);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.checkrow input{width:16px;height:16px;margin-top:3px;accent-color:var(--flow);flex-shrink:0}
.checkrow span{font-size:14.5px;color:var(--ink2)}
.chip{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);color:var(--ink2)}
.chip.f{background:var(--flow-bg);border-color:var(--flow-line);color:var(--flow-ink)}
.chip.g{background:var(--gate-bg);border-color:var(--gate-line);color:var(--gate-ink)}
.hint{display:flex;gap:9px;font-size:13.5px;color:var(--ink2);background:var(--paper);border-left:3px solid var(--gate);padding:9px 12px;margin-top:16px;line-height:1.55}
.hint b{color:var(--gate-ink);font-weight:600}

/* ---------- notebook spine (signature) ---------- */
.spine{position:relative;margin-top:30px;padding-left:34px}
.spine::before{content:'';position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--gate);opacity:.55}
.phase{position:relative;margin-bottom:18px}
.phase::before{content:'';position:absolute;left:-32px;top:20px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line2)}
.phase.done::before{background:var(--flow);border-color:var(--flow)}
.phase.open::before{background:var(--gate);border-color:var(--gate)}
.phase .ph-card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.phase.open .ph-card{border-color:var(--gate-line)}
.ph-head{display:flex;align-items:baseline;gap:12px;padding:16px 20px;cursor:pointer}
.ph-head:focus-visible{outline:2px solid var(--flow);outline-offset:-2px}
.ph-head .num{font-family:var(--mono);font-size:11px;color:var(--ink3)}
.ph-head h2{flex:1}
.ph-head .st{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em}
.phase.done .st{color:var(--flow)}
.phase.open .st{color:var(--gate)}
.phase.lock .st{color:var(--ink3)}
.ph-body{padding:2px 22px 22px;border-top:1px solid var(--line)}
.phase.lock .ph-card{opacity:.55}
.phase.lock .ph-head{cursor:default}

/* ---------- gate stamp (signature) ---------- */
.gate{margin-top:22px;border:1.5px dashed var(--gate-line);background:var(--gate-bg);border-radius:10px;padding:15px 18px}
.gate .stamp{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--gate-ink);font-weight:500}
.gate ul{margin:9px 0 0 18px;font-size:13px;color:var(--ink2)}
.gate ul li{margin-bottom:4px}
.gate.ok{border-color:var(--flow-line);background:var(--flow-bg)}
.gate.ok .stamp{color:var(--flow-ink)}
.gate .btn{margin-top:12px}

/* ---------- rows (linaje, predicciones, iteraciones) ---------- */
.rowset{margin-top:6px}
.rw{border:1px solid var(--line);border-radius:9px;padding:13px 14px;margin-top:10px;background:var(--paper);position:relative}
.rw .del{all:unset;cursor:pointer;position:absolute;top:8px;right:10px;color:var(--ink3);font-size:15px;line-height:1;padding:3px}
.rw .del:hover{color:var(--danger)}
.rw label:first-of-type{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
.pred-tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--gate-ink)}

/* ---------- prompt drawer ---------- */
details.prompt{margin-top:16px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
details.prompt summary{cursor:pointer;padding:11px 14px;font-size:13px;font-weight:500;color:var(--flow-ink);list-style:none;display:flex;gap:8px;align-items:center}
details.prompt summary::before{content:'›';font-family:var(--mono);transition:transform .15s}
details.prompt[open] summary::before{transform:rotate(90deg)}
details.prompt pre{margin:0 14px 12px;padding:13px;background:var(--paper);border:1px solid var(--line);border-radius:7px;font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;color:var(--ink2)}
details.prompt .btn{margin:0 14px 13px}

/* ---------- task list ---------- */
.tlist{display:flex;flex-direction:column;gap:12px;margin-top:24px}
.tcard{display:flex;align-items:center;gap:16px;cursor:pointer}
.tcard:hover{border-color:var(--flow-line)}
.tcard .dots{display:flex;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line2)}
.dot.d{background:var(--flow);border-color:var(--flow)}
.dot.o{background:var(--gate);border-color:var(--gate)}
.tcard .meta{flex:1;min-width:0}
.tcard .meta h3{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcard .meta p{font-size:12.5px;color:var(--ink3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{margin-top:26px;padding:34px;text-align:center;border:1.5px dashed var(--line2);border-radius:12px;color:var(--ink2);font-size:14px}

/* ---------- reference tables ---------- */
table{width:100%;border-collapse:collapse;margin-top:16px;font-size:13px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:8px 10px;border-bottom:1.5px solid var(--line2);vertical-align:bottom}
td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2);line-height:1.55}
td b{color:var(--ink);font-weight:600}
td .sig{color:var(--danger);font-size:12.5px}
.anti{margin-top:14px}
.anti h3{color:var(--danger)}
.anti p{font-size:13.5px;color:var(--ink2);margin-top:6px}
.anti .det{font-family:var(--mono);font-size:11.5px;color:var(--ink3);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}

/* ---------- registro view ---------- */
.mdbox{width:100%;min-height:340px;font-family:var(--mono);font-size:12px;line-height:1.7}
.banner{background:var(--flow-bg);border:1px solid var(--flow-line);color:var(--flow-ink);border-radius:9px;padding:11px 15px;font-size:13.5px;margin-top:18px}
.banner.warn{background:var(--gate-bg);border-color:var(--gate-line);color:var(--gate-ink)}
.back{all:unset;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--ink3);margin-bottom:16px;display:inline-block}
.back:hover{color:var(--ink)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div>
      <div class="brand">Bitácora<small>protocolo analítico<br>asistido por IA</small></div>
      <nav class="nav" id="nav"></nav>
      <div id="saveState"></div>
    </div>
    <div class="foot">comprender → predecir →<br>ejecutar → confrontar</div>
  </aside>
  <main id="app" aria-live="polite"></main>
</div>
<script>
/* ================= data: prompts, matriz, anti-patrones ================= */
const UNIV = {
soc:{t:'Prompt de tutor socrático (LLM de razonamiento)',x:`Te comparto mi Guía de comprensión y predicción. Tu rol es de tutor socrático estricto.
PROHIBIDO: proponer un plan, redactar secciones por mí, darme predicciones o "mejorar" mi documento.
PERMITIDO, una pregunta a la vez y máximo 5 en total:
1. Señalar supuestos implícitos que no declaré.
2. Buscar contraejemplos concretos a mis predicciones.
3. Preguntarme por elementos, actores o pasos omitidos.
4. Atacar mi alcance con casos borde realistas.
Cuando responda cada pregunta, evalúa si mi respuesta es sólida o evasiva antes de pasar a la siguiente.

GUÍA:
[pegar aquí]`},
aar:{t:'Prompt de facilitador AAR (solo preguntas)',x:`Vamos a hacer mi After-Action Review. Tu rol es de facilitador: SOLO formulas preguntas, una a la vez.
PROHIBIDO: explicar las discrepancias por mí, proponer causas, redactar conclusiones o resumir "lo aprendido".
Secuencia de preguntas:
1. ¿Qué esperaba exactamente (predicción y umbral)?
2. ¿Qué ocurrió en la realidad?
3. ¿Por qué la diferencia? (exige mecánica causal, rechaza respuestas vagas)
4. ¿Qué suposición MÍA era incorrecta o incompleta?
5. ¿Qué cambio procedimentalmente en la próxima tarea?
Si mi respuesta culpa solo a factores externos, repregunta hasta que identifique una suposición propia.

PREDICCIONES Y RESULTADOS:
[pegar aquí]`},
toolF2:'Tu cabeza primero. Luego un LLM razonador como tutor socrático sobre TU borrador. Nunca "escríbeme el plan".',
toolF4:'Humano. La IA solo formula preguntas como facilitador. Prohibido que redacte la retrospectiva por ti.'
};

const TIPOS = {
datos:{ nombre:'Análisis de datos',
 f1:{ t:'Orientación y rastreo de linaje', s:'Mapear el territorio antes de razonar. Solo extracción, cero interpretación.',
  rows:[{k:'variable',l:'Variable / indicador',ph:'ej. MLTV_ADOPTION'},
        {k:'origen',l:'Origen físico (tabla.campo real)',ph:'ej. RP_GOLD_DB.GROWTH.FCT_ORDERS.IS_MLTV'},
        {k:'ruta',l:'Query / ruta de construcción',ph:'link o referencia a la query del diccionario'},
        {k:'negocio',l:'Significado en lenguaje de negocio',ph:'qué mide realmente, en tus palabras'}],
  label:'Rastreo de linaje', add:'+ Agregar variable',
  gateMsg:'Mapea al menos una variable a su origen físico real (tabla y campo, no el nombre bonito del dashboard).',
  check:'Todas las variables del requerimiento tienen origen físico rastreado. No estoy razonando sobre nombres bonitos de dashboard.',
  dudasPh:'ej. el diccionario dice "usuarios activos" pero no define la ventana temporal',
  hint:'Rastrea primero la variable que menos entiendes. Es la que más probablemente invalide el plan, y quieres saberlo ahora, no en la fase 3.',
  tool:'RAG (NotebookLM / Claude con archivos) · information_schema · Excel manual — tier económico. Delegas extracción; no delegas resolver contradicciones entre fuentes.',
  prompt:{t:'Prompt de extracción literal (RAG / NotebookLM)',x:`Actúa como motor de extracción, no como analista. Del corpus adjunto, extrae SOLO información literal sobre el indicador [NOMBRE]:
1. Definición exacta tal como está escrita.
2. Tabla, vista o archivo de origen.
3. Campos que lo componen y filtros aplicados.
4. La query o transformación referenciada, completa.
Devuelve citas textuales con su ubicación. Prohibido interpretar, parafrasear o inferir. Si algo no consta, responde exactamente: "no consta".`}},
 f2:{ decisionPh:'ej. el VP decide si escalar la campaña MLTV a Monterrey según la conversión de GDL',
  predPh:'ej. la adopción de MLTV en GDL estará entre 8% y 12%, mayor en zonas de alto ticket',
  umbralPh:'ej. falsa si <8% o >12%',
  pasosPh:`1. join orders×users por user_id, ventana ene–jun
2. excluir órdenes canceladas
3. ...`},
 f3:{ checkA:'El código corre de punta a punta y devuelve un set de datos limpio con métricas descriptivas.',
  checkB:'Audité cada join, filtro y agregación que la IA introdujo. Puedo explicar cada CTE sin releer el chat.',
  intentoPh:'ej. v1 de la query de adopción con join a dim_users',
  tool:'Copiloto tier medio alimentado con tu guía de la fase 2. Todo lo que genere se audita antes de integrarse.',
  prompts:[{t:'Prompt generador de queries (ingiere la guía)',x:`Genera la query siguiendo ESTRICTAMENTE la guía adjunta. Reglas duras:
1. Usa únicamente las tablas y campos listados en la sección de linaje. Nada más.

3. Comenta cada CTE indicando qué paso de la guía implementa.
4. Si un paso es ambiguo, DETENTE y pregúntame en lugar de asumir.
5. Dialecto: Snowflake.

GUÍA:
[pegar aquí]`},{t:'Prompt de depuración acotada',x:`Este es el error y el fragmento de query. Corrige SOLO el error señalado sin reestructurar la lógica ni "optimizar" nada más. Explica en una línea qué causaba el error.

ERROR:
[pegar]

QUERY:
[pegar]`}]},
 f4:{ patronL:'Patrón reutilizable', patronPh:'-- la query o script que copiarás la próxima vez' }},

software:{ nombre:'Software / automatización',
 f1:{ t:'Orientación y mapeo del terreno', s:'Entender el sistema y sus restricciones antes de escribir una línea. Solo reconocimiento.',
  rows:[{k:'variable',l:'Componente / requisito',ph:'ej. endpoint de reservas, cron de scraping'},
        {k:'origen',l:'Fuente de verdad',ph:'repo, doc, sistema existente, dueño del proceso'},
        {k:'ruta',l:'Referencia exacta',ph:'link al archivo, módulo o documento'},
        {k:'negocio',l:'Qué debe hacer, en tus palabras',ph:'el comportamiento esperado, sin jerga'}],
  label:'Mapa del sistema', add:'+ Agregar componente',
  gateMsg:'Mapea al menos un componente o requisito a su fuente de verdad (repo, doc o dueño).',
  check:'Cada requisito tiene fuente de verdad identificada y sé qué partes del sistema toca. No voy a programar sobre supuestos.',
  dudasPh:'ej. no sé si la API externa soporta paginación; ¿quién es el dueño del esquema?',
  hint:'Empieza por el componente que menos entiendes o la integración más riesgosa: es la que puede invalidar el diseño completo.',
  tool:'Lectura de repo y docs con IA ("explícame este módulo"), RAG sobre documentación — tier económico. Delegas reconocimiento; no delegas decidir la arquitectura.',
  prompt:{t:'Prompt de reconocimiento de código/docs',x:`Actúa como lector de código y documentación, no como arquitecto. Del material adjunto extrae SOLO:
1. Qué hace hoy el módulo/sistema [X].
2. Sus dependencias y contratos (inputs, outputs, formatos).
3. Restricciones explícitas: versiones, límites, convenciones del repo.
Cita archivo y línea (o sección) de cada afirmación. Prohibido proponer cambios o mejoras. Si algo no está documentado, di "no consta".`}},
 f2:{ decisionPh:'ej. con esto el equipo deja de moderar videos a mano; éxito: <5 min por lote',
  predPh:'ej. la integración con la API de X tomará menos de 2 días y no tocará el core',
  umbralPh:'ej. falsa si necesito modificar el esquema de la BD',
  pasosPh:`1. definir contrato del endpoint
2. implementar validación
3. integrar con el worker de Celery
4. ...`},
 f3:{ checkA:'La solución corre de punta a punta contra el criterio de done de la guía, no "en mi máquina a medias".',
  checkB:'Entiendo cada bloque que la IA generó y puedo explicarlo sin releer el chat. Cero cajas negras integradas.',
  intentoPh:'ej. v1 del endpoint con validación pydantic',
  tool:'Copiloto tier medio con tu guía como spec. Tú decides la arquitectura; él escribe el boilerplate.',
  prompts:[{t:'Prompt de implementación desde spec',x:`Implementa siguiendo ESTRICTAMENTE la spec adjunta. Reglas duras:
1. Solo los componentes y contratos listados. Nada más.
2. No introduzcas dependencias, patrones ni "mejoras" fuera de la spec.
3. Comenta cada función indicando qué requisito implementa.
4. Si algo es ambiguo, DETENTE y pregunta en lugar de asumir.
Stack: [FastAPI / Python / n8n según aplique].

SPEC:
[pegar aquí]`}]},
 f4:{ patronL:'Patrón reutilizable', patronPh:'# el snippet, config o estructura que copiarás la próxima vez' }},

campana:{ nombre:'Campaña / outreach',
 f1:{ t:'Orientación y mapeo de actores', s:'Saber a quién contactas y por qué antes de escribir un solo mensaje.',
  rows:[{k:'variable',l:'Actor / creador',ph:'ej. @jorgeleo._'},
        {k:'origen',l:'Canal y alcance',ph:'ej. TikTok 120K · IG 45K · engagement 6%'},
        {k:'ruta',l:'Contacto / referencia',ph:'DM, mail, manager, link a sus videos clave'},
        {k:'negocio',l:'Por qué es fit',ph:'qué de su contenido conecta con el objetivo'}],
  label:'Mapa de actores', add:'+ Agregar actor',
  gateMsg:'Registra al menos un actor con canal y alcance verificados.',
  check:'Cada actor tiene datos verificados (alcance real, contacto, fit). No voy a contactar a ciegas.',
  dudasPh:'ej. ¿el engagement de @X es orgánico? ¿quién negocia, él o su manager?',
  hint:'Investiga primero al actor del que más dudas: si el fit no existe, mejor descubrirlo antes de diseñar la campaña alrededor de él.',
  tool:'Scraping y búsqueda asistida (tu pipeline de ScrapeCreators, búsqueda web) · tier económico para resumir perfiles. Delegas recolección; no delegas juzgar el fit.',
  prompt:{t:'Prompt de perfil de creador (solo hechos)',x:`Resume SOLO con datos verificables del perfil/material adjunto:
1. Temas de contenido y formatos que le funcionan.
2. Frecuencia de publicación y engagement observable.
3. Marcas o restaurantes con los que ya trabajó.

window.storage = window.storage || {
  async get(key){
    const res = await fetch('/api/storage/' + encodeURIComponent(key));
    if(res.status === 404) return null;
    if(!res.ok) throw new Error('storage get failed');
    return res.json();
  },
  async set(key, value){
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({value})
    });
    if(!res.ok) throw new Error('storage set failed');
  },
  async delete(key){
    const res = await fetch('/api/storage/' + encodeURIComponent(key), {method:'DELETE'});
    if(!res.ok && res.status !== 404) throw new Error('storage delete failed');
  }
};
const hasStore = typeof window.storage !== 'undefined' && !!window.storage?.get;
const mem = {};
async function sget(k){ if(!hasStore) return mem[k] ?? null;
  try{ const r = await window.storage.get(k); return r ? r.value : null; }catch(e){ return null; } }
async function sset(k,v){ if(!hasStore){ mem[k]=v; return; }
  try{ await window.storage.set(k,v); }catch(e){ console.error('storage',e); flash('No se pudo guardar. Reintenta.'); } }

function setPath(obj, path, val){
  const parts = path.split('.'); let o = obj;
  for(let i=0;i<parts.length-1;i++){ const p=parts[i]; o = /^\d+$/.test(p) ? o[+p] : o[p]; }
  const last = parts[parts.length-1];
  if(/^\d+$/.test(last)) o[+last]=val; else o[last]=val;
}

/* ================= gates ================= */
function gate(t){
  const c = cfg(t);
  const f=[];
  if(t.fase===1){
    const [k1,k2]=[c.f1.rows[0].k, c.f1.rows[1].k];
    if(!t.f1.linaje.some(r=>(r[k1]||'').trim() && (r[k2]||'').trim()))
      f.push(c.f1.gateMsg);
    if(!t.f1.checkMapeo)
      f.push('Marca la confirmación de mapeo completo al final de la fase.');
  }
  if(t.fase===2){
    if(!t.f2.decision.trim()) f.push('Escribe la decisión o resultado que esta tarea habilita (working backwards).');
    if(!t.f2.alcance.trim() || !t.f2.noObjetivos.trim()) f.push('Define alcance Y no-objetivos. Los no-objetivos evitan el sobre-alcance.');
    if(!t.f2.pasos.trim()) f.push('Esquematiza los pasos en viñetas.');
    const ok = t.f2.predicciones.filter(p=>(p.texto||'').trim() && (p.umbral||'').trim());
    if(ok.length<3) f.push('Completa 3 predicciones en el bloque "Registro de predicciones": cada una necesita texto y umbral. Llevas '+ok.length+' de 3.');
  }
  if(t.fase===3){
    if(!t.f3.iteraciones.some(i=>i.intento.trim())) f.push('Registra al menos una iteración: qué hiciste y qué pasó.');
    if(!t.f3.checkCompila) f.push('Confirma: '+c.f3.checkA);
    if(!t.f3.checkAuditado) f.push('Confirma: '+c.f3.checkB);
  }
  if(t.fase===4){
    const completas = t.f4.aar.filter(a=>(a.observado||'').trim() && (a.causa||'').trim()).length;
    if(completas < t.f4.aar.length)
      f.push('Completa observado y causa en cada predicción del AAR. Llevas '+completas+' de '+t.f4.aar.length+'.');
    if(!t.f4.aar.some(a=>a.mia))
      f.push('Al menos una causa debe señalar una suposición TUYA incorrecta o incompleta. Culpar solo a factores externos es AAR ritualista.');
    if(!t.f4.cambio.trim()) f.push('Define el cambio procedimental concreto para la próxima tarea.');
    if(!t.f4.titulo.trim()) f.push('Titula el registro como una afirmación ("X funciona así, no así"), no como un tema.');
  }
  return f;
}

/* ================= registro permanente ================= */
function buildMd(t){
  const L=[];
  L.push('# '+t.f4.titulo.trim());
  L.push('');
  const c = cfg(t);
  L.push('Fecha: '+hoy()+' · Tarea: '+t.nombre+' · Tipo: '+c.nombre + (t.plantillaDe?(' · Copiado de: '+t.plantillaDe):''));
  L.push('');
  L.push('## Contexto');
  L.push(t.directiva.trim());
  L.push('');
  L.push('## '+c.f1.label);
  const [k1,k2,k3,k4]=c.f1.rows.map(r=>r.k);
  t.f1.linaje.filter(r=>(r[k1]||'').trim()).forEach(r=>{
    L.push('- **'+r[k1].trim()+'** ← '+(r[k2]||'').trim()+((r[k3]||'').trim()?(' · '+r[k3].trim()):'')+((r[k4]||'').trim()?(' — '+r[k4].trim()):''));
  });
  L.push('');
  L.push('## After-Action Review');
  t.f4.aar.forEach((a,i)=>{
    L.push('**Predicción '+(i+1)+':** '+a.pred);
    L.push('- Observado: '+a.observado.trim());
    L.push('- Causa: '+a.causa.trim()+(a.mia?' *(suposición propia corregida)*':''));
    L.push('');
  });
  L.push('**Cambio procedimental:** '+t.f4.cambio.trim());
  L.push('');
  if(t.f4.patron.trim()){
    L.push('## Patrón reutilizable');
    L.push('```sql');
    L.push(t.f4.patron.trim());
    L.push('```');
    L.push('');
  }
  if(t.f4.conexiones.trim()){
    L.push('## Conexiones');
    L.push(t.f4.conexiones.trim());
  }
  return L.join('\n');
}

    return `<div class="gate" id="gatebox"><div class="stamp">⨯ compuerta cerrada — fase ${fase}</div><ul>${falt.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
  }
  const lbl = fase<4 ? 'Validar y pasar a la fase '+(fase+1) : 'Cerrar tarea y generar registro permanente';
  return `<div class="gate ok" id="gatebox"><div class="stamp">✓ compuerta abierta — requisitos cumplidos</div><button class="btn" data-a="avanzar">${esc(lbl)}</button></div>`;
}
function updateGate(){
  const g = document.getElementById('gatebox');

function viewTarea(){
  const t = cur;
  const fasesT = [{n:1,t:cfg(t).f1.t,s:cfg(t).f1.s},FASES[1],FASES[2],FASES[3]];
  const phases = fasesT.map(F=>{
    const st = t.estado==='completada' ? 'done' : (F.n<t.fase?'done':F.n===t.fase?'open':'lock');
    const openBody = st==='open' || (st==='done' && uiOpen.has(F.n));
    const bodyFn = [f1Html,f2Html,f3Html,f4Html][F.n-1];
    const stLbl = st==='done'?'✓ validada':st==='open'?'en curso':'bloqueada';
    return `<div class="phase ${st}">
      <div class="ph-card">
        <div class="ph-head" ${st==='done'?`data-a="toggle" data-f="${F.n}" role="button" tabindex="0"`:''}>
          <span class="num">F${F.n}</span><h2>${F.t}</h2><span class="st">${stLbl}</span>
        </div>
        ${openBody?`<div class="ph-body"><p class="sub" style="margin-top:10px;font-size:13px">${F.s}</p>${bodyFn(t)}${st==='open'?gateHtml(t):''}</div>`:''}
      </div>
    </div>`;
  }).join('');
  const reg = index.registros.find(r=>r.taskId===t.id);
  return `
    <button class="back" data-a="nav" data-v="inicio">← tareas</button>
    <div class="eyebrow">${esc(t.directiva).slice(0,120)}</div>
    <h1 style="margin-top:6px">${esc(t.nombre)}</h1>
    <div style="margin-top:10px"><span class="chip">${esc(cfg(t).nombre)}</span> <span class="chip ${t.estado==='completada'?'f':'g'}">${t.estado==='completada'?'completada':'fase '+t.fase+' de 4'}</span>${t.plantillaDe?` <span class="chip">copiada de: ${esc(t.plantillaDe)}</span>`:''}</div>
    ${t.estado==='completada'&&reg?`<div class="banner">Tarea cerrada. Su registro permanente vive en la biblioteca. <button class="btn ghost tiny" data-a="ver-reg" data-id="${reg.id}">Ver registro</button></div>`:''}
    <div class="spine">${phases}</div>`;
}

/* ================= render & actions ================= */
async function render(){
  $('#nav').innerHTML = navHtml();
  const app = $('#app');
  if(route.view==='inicio') app.innerHTML = viewInicio();
  else if(route.view==='intake') app.innerHTML = viewIntake();
  else if(route.view==='tarea') app.innerHTML = viewTarea();
  else if(route.view==='biblioteca') app.innerHTML = viewBiblioteca();
  else if(route.view==='registro') app.innerHTML = await viewRegistro();
  else if(route.view==='referencia') app.innerHTML = viewReferencia();
  window.scrollTo(0,0);
}

async function handleAction(a, ds, el){
  if(a==='nav'){ route={view:ds.v,id:null}; if(ds.v!=='tarea') cur=null; pendingPrefill=null; render(); }
  else if(a==='nueva'){ pendingPrefill=null; route={view:'intake'}; render(); }
  else if(a==='crear'){
    const nombre=$('#nnombre').value.trim(), dir=$('#ndirectiva').value.trim();
    const tipo=($('#ntipo')&&$('#ntipo').value)||'general';
    if(!nombre){ flash('Ponle nombre a la tarea.'); $('#nnombre').focus(); return; }
    const t = blankTask(nombre, dir, tipo, pendingPrefill?pendingPrefill.from:null);
    if(pendingPrefill){
      if(pendingPrefill.linaje) t.f1.linaje = pendingPrefill.linaje.map(r=>({...r}));
      Object.assign(t.f2, pendingPrefill.f2||{});
      if(pendingPrefill.patron) t.f3.notas = 'Patrón heredado para adaptar:\n'+pendingPrefill.patron;
    }
    index.tareas.unshift({id:t.id,nombre:t.nombre,fase:1,estado:'activa',tipo:t.tipo});
    cur=t; await saveCur();
    route={view:'tarea',id:t.id}; uiOpen.clear(); pendingPrefill=null; render();
  }
  else if(a==='abrir'){
    const raw = await sget('bitacora:t:'+ds.id);
    if(!raw){ flash('No se pudo abrir la tarea.'); return; }
    cur = ensureTaskShape(JSON.parse(raw)); if(!cur.tipo) cur.tipo='datos'; route={view:'tarea',id:ds.id}; uiOpen.clear(); render();
  }
  else if(a==='borrar'){
    if(!confirm('¿Borrar esta tarea? Su registro en la biblioteca (si existe) se conserva.')) return;
    index.tareas = index.tareas.filter(t=>t.id!==ds.id);
    if(hasStore){ try{ await window.storage.delete('bitacora:t:'+ds.id); }catch(e){} }
    await sset('bitacora:index', JSON.stringify(index));
    if(cur&&cur.id===ds.id) cur=null;
    render();
  }
  else if(a==='toggle'){ const f=+ds.f; uiOpen.has(f)?uiOpen.delete(f):uiOpen.add(f); render(); }
  else if(a==='add-linaje'){ cur.f1.linaje.push({variable:'',origen:'',ruta:'',negocio:''}); await saveCur(); render(); }
  else if(a==='del-linaje'){ if(cur.f1.linaje.length>1){ cur.f1.linaje.splice(+ds.i,1); await saveCur(); render(); } }
  else if(a==='add-pred'){ cur.f2.predicciones.push({texto:'',umbral:'',conf:'media'}); await saveCur(); render(); }
  else if(a==='del-pred'){ if(cur.f2.predicciones.length>1){ cur.f2.predicciones.splice(+ds.i,1); await saveCur(); render(); } }
  else if(a==='add-iter'){ cur.f3.iteraciones.push({intento:'',resultado:'',ajuste:''}); await saveCur(); render(); }
  else if(a==='del-iter'){ if(cur.f3.iteraciones.length>1){ cur.f3.iteraciones.splice(+ds.i,1); await saveCur(); render(); } }
  else if(a==='guardar'){
    const prompt2 = document.getElementById('f2prompt');
    const prompt3 = document.getElementById('f3prompt');
    const prompt4 = document.getElementById('f4prompt');
    if(prompt2 && cur?.f2) cur.f2.promptGuia = prompt2.value;
    if(prompt3 && cur?.f3) cur.f3.promptEjecucion = prompt3.value;
    if(prompt4 && cur?.f4) cur.f4.promptAar = prompt4.value;
    await saveCur();
    flash('guardado ✓');
  }
  else if(a==='insertar-guia'){
    cur.f2.guia = buildGuide(cur);
    cur.f2.promptGuia = buildGuidePrompt(cur);
    await saveCur();
    flash('guía insertada en el prompt ✓');
    render();
  }
  else if(a==='insertar-guia-ejecucion'){
    const prompt = (cur.f3.promptEjecucion || ((cfg(cur).f3.prompts && cfg(cur).f3.prompts[0] && cfg(cur).f3.prompts[0].x) || '')).trim();
    const guia = (cur.f2.guia || '').trim() || buildGuide(cur);
    cur.f2.guia = guia;
    cur.f3.promptEjecucion = prompt.includes('[pegar aquí]') ? prompt.replace('[pegar aquí]', guia) : prompt + '\n\nGUÍA:\n' + guia;
    await saveCur();
    flash('guía insertada en el prompt ✓');
    render();
  }
  else if(a==='actualizar-guia'){ cur.f2.guia = buildGuide(cur); cur.f2.promptGuia = buildGuidePrompt(cur); await saveCur(); flash('guía y prompt enlazados ✓'); render(); }
  else if(a==='insertar-aar'){
    cur.f4.promptAar = buildAarPrompt(cur);
    await saveCur();
    flash('AAR insertado en el prompt ✓');
    render();
  }
  else if(a==='avanzar'){
    if(gate(cur).length){ updateGate(); return; }
    if(cur.fase===3){
      cur.f4.aar = cur.f2.predicciones.filter(p=>p.texto.trim()).map(p=>({pred:p.texto.trim()+' — umbral: '+p.umbral.trim(), observado:'', causa:'', mia:false}));
    }
    if(cur.fase<4){ cur.fase++; await saveCur(); render(); }
    else{ await completar(cur); }
  }
  else if(a==='copy'){
    const src = document.getElementById(ds.t);
    copyText(src ? (src.value ?? src.textContent) : '');
  }
  else if(a==='dl'){
    const md = await sget('bitacora:r:'+ds.id) || '';
    const meta = index.registros.find(r=>r.id===ds.id);
    download(((meta&&meta.titulo)||'registro').toLowerCase().replace(/[^a-z0-9áéíóúñ]+/gi,'-').slice(0,60)+'.md', md);
  }
  else if(a==='plantilla'){
    const raw = await sget('bitacora:t:'+ds.tid);
    if(!raw){ flash('No encontré la tarea original.'); return; }
    const o = JSON.parse(raw);
    pendingPrefill = { from: ds.from, tipo: o.tipo||'datos',
      linaje: o.f1.linaje,
      f2: { alcance:o.f2.alcance, noObjetivos:o.f2.noObjetivos, pasos:o.f2.pasos, decision:'', faqs:'', descartadas:'', predicciones:[{texto:'',umbral:'',conf:'media'},{texto:'',umbral:'',conf:'media'},{texto:'',umbral:'',conf:'media'}] },
      patron: o.f4.patron };
    route={view:'intake'}; render();
  }
  else if(a==='ver-reg'){ route={view:'registro',id:ds.id}; render(); }
}

function copyText(txt){
  const done = ()=>flash('copiado ✓');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  } else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); done(); }catch(e){ flash('Copia manual desde el cuadro.'); }
  ta.remove();
}
function download(name, txt){
  try{
    const b=new Blob([txt],{type:'text/markdown'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ flash('Descarga bloqueada aquí: usa "Copiar markdown".'); }
}

/* ================= events & init ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-a]');
  if(!el) return;
  if(el.dataset.a==='abrir' && e.target.closest('[data-a="borrar"]')) return;
  handleAction(el.dataset.a, el.dataset, el);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && e.target.matches('[role="button"][data-a]')) handleAction(e.target.dataset.a, e.target.dataset, e.target);
});
document.addEventListener('input', e=>{
  const p = e.target.dataset.p;
  if(p && cur){
    const v = e.target.type==='checkbox' ? e.target.checked : e.target.value;
    setPath(cur, p, v); dirty(); updateGate();
  }
});
document.addEventListener('change', e=>{
  const p = e.target.dataset.p;
  if(p && cur && (e.target.type==='checkbox' || e.target.tagName==='SELECT')){
    const v = e.target.type==='checkbox' ? e.target.checked : e.target.value;
    setPath(cur, p, v); dirty(); updateGate();
  }
});

(async function init(){
  try{
    const raw = await sget('bitacora:index');
    if(raw) index = JSON.parse(raw);
  }catch(e){ console.error(e); }
  render();
})();
</script>
