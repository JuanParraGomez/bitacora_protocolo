services:
  bitacora-protocolo:
    build: .
    container_name: bitacora_protocolo
    restart: always
    environment:
      PORT: ${PORT:-3000}
      DATA_DIR: ${DATA_DIR:-/app/data}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.bitacora-protocolo.rule=Host(`bitacora.uniflexa.cloud`)"
      - "traefik.http.routers.bitacora-protocolo.entrypoints=https,websecure"
      - "traefik.http.routers.bitacora-protocolo.tls=true"
      - "traefik.http.routers.bitacora-protocolo.tls.certresolver=letsencrypt"
      - "traefik.http.services.bitacora-protocolo.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
